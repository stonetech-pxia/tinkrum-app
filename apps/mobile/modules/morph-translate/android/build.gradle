// Android portion of the local Expo module (D-170): Google ML Kit on-device translation and
// language recognition. Translation language models (approx. 30 MB each) are downloaded on first
// use after user confirmation and are available offline thereafter; language recognition models are
// bundled in the app. Neither requires Google Play services. ML Kit is a closed-source Google
// component; see DECISIONS P-015 for its relation to AGPL.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphtranslate'
version = '1.0.0'

android {
  namespace "expo.modules.morphtranslate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // R8 is enabled in the release build: ML Kit internal classes must not be merged or obfuscated.
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "com.google.mlkit:translate:17.0.3"
  implementation "com.google.mlkit:language-id:17.0.6"
}
