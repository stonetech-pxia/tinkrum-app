// Android part of the local Expo module (D-141): Jetpack Media3 Transformer (Apache-2.0, official
// Google) compresses, transcodes, and trims video and audio on-device using the phone's hardware
// encoder; MediaExtractor / MediaMetadataRetriever from the system are used for reading info and
// extracting frames. MP3 uses LAME compiled into the app (D-183, src/main/cpp).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphmedia'
version = '1.0.0'

android {
  namespace "expo.modules.morphmedia"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
      buildStagingDirectory "${rootProject.buildDir}/morph-media-cxx"
    }
  }
}

dependencies {
  // Must match the Media3 version used by expo-video (androidxMedia3Version in its build.gradle),
  // otherwise Gradle will upgrade both sides to the same version, which may cause expo-video
  // incompatibility.
  def media3Version = "1.9.1"
  implementation "androidx.media3:media3-transformer:${media3Version}"
  implementation "androidx.media3:media3-effect:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  testImplementation 'junit:junit:4.13.2'
}

// Original licenses of native C dependencies are distributed with the APK, without packing C source code.
def copyDspLicenses = tasks.register('copyDspLicenses', Copy) {
  from('../dsp/notices')
  into("${project.buildDir}/generated/dsp-licenses/third-party")
}
android.sourceSets.main.assets.srcDir("${project.buildDir}/generated/dsp-licenses")
tasks.named('preBuild').configure { dependsOn(copyDspLicenses) }
