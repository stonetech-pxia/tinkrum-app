// Android portion of the local Expo module (D-271): dynamic shortcuts using ShortcutManagerCompat
// (from androidx.core, bundled with react-android) and pinned desktop icons. Uses system APIs only.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphshortcuts'
version = '1.0.0'

android {
  namespace "expo.modules.morphshortcuts"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
