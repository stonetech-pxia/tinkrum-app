// Android portion of local Expo module (D-160): foreground service allowing long-running video and
// audio tasks to finish even when switching to other apps. Uses only Android system APIs and
// AndroidX Core (already provided by expo-modules-core), with zero third-party code.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphbackground'
version = '1.0.0'

android {
  namespace "expo.modules.morphbackground"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
