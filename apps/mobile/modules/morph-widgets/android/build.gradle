// Android portion of local Expo modules (D-321): Desktop widgets use the system's AppWidgetProvider
// + RemoteViews without adding Glance / Compose dependencies (see comparison in D-324).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphwidgets'
version = '1.0.0'

android {
  namespace "expo.modules.morphwidgets"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
}
