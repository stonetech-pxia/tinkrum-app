// Android portion of the local Expo module (D-270): Uses system TextToSpeech to read text into WAV
// on-device with no third-party dependencies. Audio is provided by the device's TTS engine (mostly
// Google Voice Services), with audio data downloaded by the user in system settings.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphtts'
version = '1.0.0'

android {
  namespace "expo.modules.morphtts"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
