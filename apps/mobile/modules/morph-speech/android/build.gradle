// Android portion of the local Expo module (D-151): Android systems cannot recognize audio files,
// so whisper.cpp (MIT) is compiled into the app, and models (along with speech detection models)
// are downloaded on first use. Audio decoding uses the system MediaExtractor / MediaCodec.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphspeech'
version = '1.0.0'

android {
  namespace "expo.modules.morphspeech"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
      version "3.22.1"
      // The whisper.cpp source code downloaded by CMake contains JS and package.json: the build
      // directory is placed under android/build in the app to prevent eslint, prettier, jest, and
      // Metro from scanning it (apps/mobile/android is already gitignored and unscanned).
      buildStagingDirectory "${rootProject.buildDir}/morph-speech-cxx"
    }
  }
  // CPU backends with SVE / SME are unused (see load_backends in morph_whisper.cpp) and are not packaged.
  packaging {
    jniLibs {
      excludes += ['**/libggml-cpu-android_armv9*.so']
    }
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
