// 本地 Expo 模块的 Android 部分（D-600）：整体导出和恢复用的 zip 读写，只用 java.util.zip 里的 Deflater、Inflater、CRC32。
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morpharchive'
version = '1.0.0'

android {
  namespace "expo.modules.morpharchive"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
