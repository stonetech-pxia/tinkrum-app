// Android portion of local Expo modules (D-600): ZIP read/write for bulk export and restore, using exclusively Deflater, Inflater, and CRC32 from java.util.zip.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morpharchive'
version = '1.0.0'

android {
  namespace "expo.modules.morpharchive"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}
