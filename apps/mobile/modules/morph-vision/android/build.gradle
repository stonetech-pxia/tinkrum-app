// Android portion of the local Expo module (D-087): OCR uses PP-OCRv6 (D-269, running models via
// ONNX Runtime with models downloaded as extension packs), ML Kit retains only the Korean
// recognizer (models packaged into the app); document scanning uses Google Play services. ML Kit is
// a closed-source Google component; see DECISIONS P-015 regarding AGPL compliance.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphvision'
version = '1.0.0'

android {
  namespace "expo.modules.morphvision"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // R8 is enabled in the release build: ML Kit internal classes must not be merged or obfuscated.
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  // Automatic face bounding for ID photos (D-252): models packaged into the app.
  implementation "com.google.mlkit:face-detection:16.1.7"
  // Image content classification (used for recommendations on photos without text): base image labeling model packaged into the app. Version not verified on Google Maven; confirm during synchronization.
  implementation "com.google.mlkit:image-labeling:17.0.9"
  // Pre-filling date and amount for "log an expense" (supplementing rules only): entity extraction, with models for each language downloaded on first use. Version not verified on Google Maven.
  implementation "com.google.mlkit:entity-extraction:16.0.0-beta5"
  // PP-OCRv6 does not recognize Korean, so Korean continues to use ML Kit (D-269).
  implementation "com.google.mlkit:text-recognition-korean:16.0.1"
  // ONNX Runtime (MIT): runs the two PP-OCRv6 models (D-269).
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.30.0"
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
  implementation "com.google.android.gms:play-services-base:18.11.1"
}
