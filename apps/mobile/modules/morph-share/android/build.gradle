// Android part of local Expo modules (D-119, D-120): ACTION_SEND_MULTIPLE shares multiple files at
// once, Storage Access Framework (ACTION_OPEN_DOCUMENT_TREE) saves to a folder chosen by the user.
// Uses only Android system APIs and androidx.core FileProvider.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morphshare'
version = '1.0.0'

android {
  namespace "expo.modules.morphshare"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
